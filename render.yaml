services:
  - type: web
    name: ydkmusic
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      pip install --pre --upgrade "yt-dlp[default]" &&
      mkdir -p .deno/bin &&
      curl --fail --location --silent --show-error https://github.com/denoland/deno/releases/download/v2.7.0/deno-x86_64-unknown-linux-gnu.zip -o .deno/deno-x86_64-unknown-linux-gnu.zip &&
      curl --fail --location --silent --show-error https://github.com/denoland/deno/releases/download/v2.7.0/deno-x86_64-unknown-linux-gnu.zip.sha256sum -o .deno/deno-x86_64-unknown-linux-gnu.zip.sha256sum &&
      (cd .deno && sha256sum --check deno-x86_64-unknown-linux-gnu.zip.sha256sum) &&
      unzip -q .deno/deno-x86_64-unknown-linux-gnu.zip -d .deno/bin &&
      chmod +x .deno/bin/deno &&
      rm .deno/deno-x86_64-unknown-linux-gnu.zip .deno/deno-x86_64-unknown-linux-gnu.zip.sha256sum &&
      .deno/bin/deno --version
    startCommand: PATH="$PWD/.deno/bin:$PATH" uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ydkmusic-db
          property: connectionString
      - key: GOOGLE_OAUTH_CLIENT_JSON
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://ydkmusic.onrender.com/api/auth/google-drive/callback
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: MUSIXMATCH_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://localhost,capacitor://localhost
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"

databases:
  - name: ydkmusic-db
    plan: free
